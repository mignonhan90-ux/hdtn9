px;font-size:27px;cursor:pointer;color:#1b4c9d}.win{font-size:clamp(35px,4.5vw,68px);color:#f18510;margin:20px 0;text-shadow:2px 3px #ffe0a2}.confetti{position:fixed;z-index:20;top:-20px;width:12px;height:22px;pointer-events:none;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}.shake{animation:shake .45s ease-in-out}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}@media(max-width:650px){.app{padding:12px}.board{gap:8px}.gift{min-height:95px;border-radius:14px}.gift .emoji{font-size:30px}.gift .num{font-size:25px}.top{flex-wrap:wrap;justify-content:center}.modal{padding:18px 12px;border-width:4px}.btn{padding:11px 13px}.question{margin:20px auto}}@media(min-width:900px) and (max-height:800px){.app{padding-top:8px}.header{margin-bottom:8px}h1{font-size:clamp(38px,4vw,64px)}.board{margin:9px auto;gap:12px}.gift{min-height:125px}.actions{margin-top:9px}}

</style></head><body><main class="app"><div class="top"><span class="pill">🎓 HĐTN 9 · KHÁM PHÁ BẢN THÂN</span><span class="pill" id="progress">🎁 ĐÃ MỞ: 0/12</span></div><header class="header"><div class="eyebrow">✨ GAMESHOW KHÁN GIẢ ✨</div><h1>QUÀ TẶNG BẤT NGỜ</h1><h2>🎉 DÁM CHƠI LÀ CÓ QUÀ! 🎉</h2></header><section id="board" class="board" aria-label="12 hộp quà"></section><div class="actions"><button class="btn orange" id="start">▶ BẮT ĐẦU</button><button class="btn white" id="sound">🔊 ÂM THANH: BẬT</button><button class="btn white" id="full">⛶ TOÀN MÀN HÌNH</button><button class="btn white" id="reset">↻ CHƠI LẠI</button></div><div class="bottom">6 LỚP 9/1 – 9/6 · CHỌN HỘP QUÀ · THỰC HIỆN NHIỆM VỤ · NHẬN QUÀ NGAY!</div></main><div class="overlay hidden" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="q"><button class="close" id="close" aria-label="Đóng">×</button><div id="modalContent"></div></section></div><script>
'use strict';const tasks=[{type:'CÂU HỎI',q:'Hãy kể tên một điểm mạnh của bản thân.',hint:'Ví dụ: Chăm chỉ, vui vẻ, biết lắng nghe.'},{type:'THỬ THÁCH',q:'Tạo 3 dáng chụp ảnh thật tự tin trong 5 giây!',hint:'MC đếm ngược 5 – 4 – 3 – 2 – 1!'},{type:'CÂU HỎI',q:'Khi bị điểm thấp, em nên bỏ cuộc hay cố gắng hơn?',hint:'Cố gắng hơn và điều chỉnh cách học.'},{type:'THỬ THÁCH',q:'Hô thật to: “TÔI TIN TÔI LÀM ĐƯỢC!”',hint:'Mời cả lớp cùng hô theo!'},{type:'CÂU HỎI',q:'Kể tên một việc em làm tốt ở nhà hoặc ở trường.',hint:'Ví dụ: Giúp bố mẹ, học tốt một môn, hỗ trợ bạn.'},{type:'THỬ THÁCH',q:'Thể hiện 3 biểu cảm: NGẠC NHIÊN – VUI VẺ – TỰ TIN.',hint:'MC lần lượt hô từng cảm xúc.'},{type:'CÂU HỎI',q:'Khi chưa hiểu bài, em có thể làm gì?',hint:'Hỏi thầy cô, bạn bè hoặc tự tìm hiểu.'},{type:'THỬ THÁCH',q:'Rủ 3 bạn tạo một dáng chụp ảnh đồng đội thật ấn tượng!',hint:'Các bạn tạo dáng trong 5 giây.'},{type:'CÂU HỎI',q:'Nêu một thói quen tốt mà em muốn duy trì.',hint:'Ví dụ: Đọc sách, đúng giờ, tập thể dục.'},{type:'THỬ THÁCH',q:'Hô tên lớp mình và một khẩu hiệu cổ vũ thật khí thế!',hint:'Cả lớp cùng hưởng ứng.'},{type:'CÂU HỎI',q:'Khi tức giận, em nên bình tĩnh hay lập tức cãi lại?',hint:'Bình tĩnh trước khi phản ứng.'},{type:'THỬ THÁCH',q:'Đập tay với 2 bạn bên cạnh và nói: “CHÚNG TA LÀM ĐƯỢC!”',hint:'Thực hiện ngay tại chỗ.'}];
let opened=new Set(),active=-1,remaining=10,timer=null,muted=false,ctx=null,started=false;const $=id=>document.getElementById(id);const palettes=[['#2c7ff4','#1245a9'],['#fb9c32','#db4b24'],['#915cf4','#582ab5'],['#14bbbd','#1473a9']];function beep(freq=550,dur=.12){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.09,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}function render(){const board=$('board');board.innerHTML='';tasks.forEach((t,i)=>{const b=document.createElement('button');b.className='gift'+(opened.has(i)?' opened':'');b.style.setProperty('--a',palettes[i%4][0]);b.style.setProperty('--b',palettes[i%4][1]);b.disabled=!started||opened.has(i);b.setAttribute('aria-label','Hộp quà số '+(i+1)+(opened.has(i)?' đã mở':''));b.innerHTML='<span class="emoji">'+(opened.has(i)?'✓':'🎁')+'</span><span class="num">'+(i+1)+'</span>';b.onclick=()=>openGift(i,b);board.appendChild(b)});$('progress').textContent='🎁 ĐÃ MỞ: '+opened.size+'/12';$('start').textContent=started?'✓ ĐANG CHƠI':'▶ BẮT ĐẦU';$('start').disabled=started}function openGift(i,b){if(!started||opened.has(i))return;active=i;opened.add(i);b.classList.add('shake');beep(630,.13);setTimeout(()=>{beep(880,.15);render();showTask()},430)}function stopTimer(){if(timer){clearInterval(timer);timer=null}}function showTask(){stopTimer();remaining=10;const t=tasks[active];$('overlay').classList.remove('hidden');$('modalContent').innerHTML='<span class="tag">🎁 HỘP '+(active+1)+' · '+t.type+'</span><div class="question" id="q">'+t.q+'</div><div class="timer" id="count">10</div><div class="hint hidden" id="hint">💡 '+t.hint+'</div><div class="modal-actions"><button class="btn orange" id="countStart">⏱ ĐẾM NGƯỢC 10 GIÂY</button><button class="btn white" id="hintBtn">💡 GỢI Ý / ĐÁP ÁN</button><button class="btn" id="prize">🎉 NHẬN QUÀ</button><button class="btn white" id="next">↩ TIẾP TỤC</button></div>';$('countStart').onclick=()=>{stopTimer();remaining=10;$('count').textContent=remaining;beep(680);timer=setInterval(()=>{remaining--;$('count').textContent=remaining;beep(remaining<=3?900:520,.08);if(remaining<=0){stopTimer();beep(1200,.5)}},1000)};$('hintBtn').onclick=()=>$('hint').classList.toggle('hidden');$('prize').onclick=win;$('next').onclick=closeModal}function win(){stopTimer();beep(880,.2);setTimeout(()=>beep(1120,.3),160);$('modalContent').innerHTML='<div style="font-size:90px">🏆🎁🎊</div><div class="win" id="q">CHÚC MỪNG!<br>BẠN ĐÃ NHẬN QUÀ!</div><div style="font-size:clamp(20px,2vw,30px)">CẢ LỚP CÙNG VỖ TAY NÀO! 👏</div><div class="modal-actions"><button class="btn orange" id="next">↩ TIẾP TỤC CHƠI</button></div>';$('next').onclick=closeModal;confetti()}function confetti(){const colors=['#ffb900','#f97316','#0ea5e9','#8b5cf6','#22c55e','#ec4899'];for(let i=0;i<80;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*.8+'s';e.style.transform='rotate('+Math.random()*180+'deg)';document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}}function closeModal(){stopTimer();$('overlay').classList.add('hidden');active=-1}function reset(){if(!confirm('Đặt lại tất cả 12 hộp quà để chơi từ đầu?'))return;closeModal();opened.clear();started=false;render()}$('start').onclick=()=>{started=true;beep(720,.2);render()};$('reset').onclick=reset;$('close').onclick=closeModal;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 ÂM THANH: TẮT':'🔊 ÂM THANH: BẬT';if(!muted)beep()};$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').classList.contains('hidden'))closeModal()});render();
</script></body></html>
